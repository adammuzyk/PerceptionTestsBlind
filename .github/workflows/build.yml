name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore .\src\PerceptionTests.sln

      - name: Build
        run: dotnet build .\src\PerceptionTests.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\src\PerceptionTests.Tests\PerceptionTests.Tests.csproj -c Release --no-build
